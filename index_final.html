<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahla Sana — AI, Data & Robotics Engineer</title>
<meta name="description" content="Portfolio of Sahla Sana — AI Engineer, Data Scientist and Mechatronics Engineer specializing in AI automation, computer vision and embedded robotics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS — CIRCUIT SLATE NEUMORPHISM ============ */
:root{
  --bg:#E4E9F0;
  --bg-deep:#D2DDEA;
  --surface:#EFF3F8;
  --text:#141B26;
  --text-soft:#4E5C76;
  --text-faint:#8290A8;
  --accent:#1E8A8C;
  --accent-strong:#146567;
  --accent-soft:#CDEAEA;
  --gold:#D9A441;
  --gold-soft:#F3E3BC;
  --shadow-d:#B7C2D3;
  --shadow-l:#FFFFFF;
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:10px;
  --maxw:1180px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:linear-gradient(160deg, var(--bg) 0%, #EAF0F5 100%);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%20viewBox='0%200%20160%20160'%3E%3Cg%20fill='none'%20stroke='%231E8A8C'%20stroke-opacity='0.10'%20stroke-width='1.4'%3E%3Cpath%20d='M0%2040H50V80H160'/%3E%3Cpath%20d='M0%20120H90V90H160'/%3E%3Cpath%20d='M30%200V30H10V160'/%3E%3Cpath%20d='M130%200V50H150V160'/%3E%3C/g%3E%3Cg%20fill='%23D9A441'%20fill-opacity='0.16'%3E%3Ccircle%20cx='50'%20cy='80'%20r='3.2'/%3E%3Ccircle%20cx='90'%20cy='90'%20r='3.2'/%3E%3Ccircle%20cx='30'%20cy='30'%20r='3.2'/%3E%3Ccircle%20cx='150'%20cy='50'%20r='3.2'/%3E%3C/g%3E%3C/svg%3E");
  background-size:220px 220px;
  z-index:0;pointer-events:none;
}
header, main, footer, .modal-overlay, .mobile-drawer{position:relative;z-index:1;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--accent-soft);color:var(--accent-strong);}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px;}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
@media(max-width:640px){.wrap{padding:0 20px;}}

/* ============ NEUMORPHIC PRIMITIVES ============ */
.neu-raised{
  background:var(--surface);
  box-shadow:9px 9px 18px var(--shadow-d), -9px -9px 18px var(--shadow-l);
  border-radius:var(--radius-lg);
}
.neu-flat{
  background:var(--surface);
  box-shadow:6px 6px 12px var(--shadow-d), -6px -6px 12px var(--shadow-l);
  border-radius:var(--radius-md);
}
.neu-pressed{
  background:var(--bg);
  box-shadow:inset 5px 5px 10px var(--shadow-d), inset -5px -5px 10px var(--shadow-l);
  border-radius:var(--radius-md);
}
.neu-pill{
  background:var(--surface);
  box-shadow:4px 4px 8px var(--shadow-d), -4px -4px 8px var(--shadow-l);
  border-radius:999px;
}

/* ============ TYPE ============ */
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;
}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--gold);border-radius:2px;}
.section-title{font-size:clamp(28px,3.6vw,40px);margin-bottom:12px;}
.section-lead{color:var(--text-soft);font-size:16.5px;max-width:640px;margin-bottom:44px;}
.mono-stat{font-family:var(--font-mono);}

/* ============ NAV ============ */
header{
  position:sticky;top:0;z-index:500;
  background:rgba(228,233,240,0.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(183,194,211,0.5);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:76px;}
.logo{
  font-family:var(--font-display);font-weight:700;font-size:19px;
  display:flex;align-items:center;gap:12px;
}
.logo-mark{
  width:38px;height:38px;border-radius:12px;
  background:var(--surface);
  box-shadow:4px 4px 8px var(--shadow-d), -4px -4px 8px var(--shadow-l);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-family:var(--font-mono);font-size:13px;font-weight:600;
}
nav.primary{display:flex;align-items:center;gap:4px;}
.nav-item{position:relative;}
.nav-link{
  display:flex;align-items:center;gap:5px;
  padding:10px 15px;border-radius:10px;
  font-size:14.5px;font-weight:500;color:var(--text-soft);
  transition:color .15s, background .15s;
}
.nav-link:hover, .nav-link.active{color:var(--accent);background:var(--bg-deep);}
.nav-link svg{width:11px;height:11px;opacity:0.7;}
.mega{
  position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);
  width:560px;padding:22px;
  opacity:0;visibility:hidden;translate:0 8px;
  transition:opacity .18s, translate .18s, visibility .18s;
  z-index:50;
}
.nav-item:hover .mega, .nav-item:focus-within .mega{opacity:1;visibility:visible;translate:0 0;}
.mega-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.mega-link{
  display:block;padding:12px 13px;border-radius:12px;
  transition:background .15s;
}
.mega-link:hover{background:var(--bg-deep);}
.mega-link .t{font-weight:600;font-size:13.8px;display:block;margin-bottom:3px;}
.mega-link .d{font-size:12px;color:var(--text-faint);line-height:1.45;}
.nav-cta{display:flex;align-items:center;gap:10px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:12px;
  font-size:14px;font-weight:600;font-family:var(--font-body);
  transition:transform .15s, box-shadow .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:var(--accent);color:#F4FBFB;
  box-shadow:5px 5px 12px var(--shadow-d), -3px -3px 8px var(--shadow-l);
}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{
  background:var(--surface);color:var(--text);
  box-shadow:5px 5px 10px var(--shadow-d), -5px -5px 10px var(--shadow-l);
}
.btn-ghost:hover{color:var(--accent);}
.btn-sm{padding:9px 16px;font-size:13px;}
.menu-toggle{display:none;}

@media(max-width:1020px){
  nav.primary, .nav-cta .btn-ghost{display:none;}
  .menu-toggle{display:flex;width:44px;height:44px;border-radius:12px;align-items:center;justify-content:center;}
}

/* ============ MOBILE NAV DRAWER ============ */
.mobile-drawer{
  position:fixed;inset:0;z-index:900;
  background:var(--bg);
  transform:translateX(100%);transition:transform .3s ease;
  overflow-y:auto;padding:24px;
}
.mobile-drawer.open{transform:translateX(0);}
.mobile-drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
.mobile-link{
  display:block;padding:16px 6px;font-size:19px;font-weight:600;font-family:var(--font-display);
  border-bottom:1px solid var(--shadow-d);
}
.mobile-sub{padding-left:14px;margin-bottom:8px;}
.mobile-sub a{display:block;padding:9px 6px;font-size:14px;color:var(--text-soft);}

/* ============ PAGES ============ */
.page{display:none;}
.page.active{display:block;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
main{min-height:70vh;}

/* ============ HERO ============ */
.hero{padding:88px 0 70px;}
.hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;}
.hero-title{font-size:clamp(34px,4.6vw,54px);line-height:1.08;margin-bottom:22px;}
.hero-title .hl{color:var(--accent);}
.hero-sub{font-size:17px;color:var(--text-soft);max-width:520px;margin-bottom:34px;}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:30px;}
.hero-socials{display:flex;gap:10px;}
.icon-btn{
  width:44px;height:44px;border-radius:12px;
  background:var(--surface);
  box-shadow:4px 4px 9px var(--shadow-d), -4px -4px 9px var(--shadow-l);
  display:flex;align-items:center;justify-content:center;color:var(--text-soft);
  transition:color .15s, transform .15s;
}
.icon-btn:hover{color:var(--accent);transform:translateY(-2px);}

.network-card{
  aspect-ratio:1/1;position:relative;padding:0;overflow:hidden;
}
.network-card svg{width:100%;height:100%;display:block;}
.network-card .sys-line{
  stroke:var(--accent-soft);stroke-width:2.2;stroke-dasharray:7 9;
  animation:sysFlow 4s linear infinite;
}
.network-card .sys-node{
  fill:var(--surface);stroke:var(--accent);stroke-width:2.8;
  transform-box:fill-box;transform-origin:center;
  animation:sysPulse 3s ease-in-out infinite;
}
.network-card .sys-node.core{
  fill:var(--accent);stroke:var(--accent);stroke-width:3;
}
.network-card .sys-core-ring{
  fill:none;stroke:var(--accent-soft);stroke-width:2;opacity:.7;
  transform-box:fill-box;transform-origin:center;
  animation:coreRing 3s ease-in-out infinite;
}
.network-card .sys-signal{
  fill:var(--gold);filter:drop-shadow(0 0 4px var(--gold));
  animation:signalPulse 2.6s ease-in-out infinite;
}
.network-card .sys-inner-line{stroke:var(--gold);stroke-width:2;opacity:.8;}
.network-card .sys-inner-node{
  fill:var(--accent);transform-box:fill-box;transform-origin:center;
  animation:innerPulse 2s ease-in-out infinite;
}
.network-card .sys-label{
  font-family:var(--font-mono);font-size:13px;font-weight:600;
  letter-spacing:1.2px;fill:var(--text-soft);text-anchor:middle;
}
@keyframes sysFlow{to{stroke-dashoffset:-64;}}
@keyframes sysPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes coreRing{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.16);opacity:.9}}
@keyframes signalPulse{0%,100%{opacity:.25;transform:scale(.55)}50%{opacity:1;transform:scale(1.35)}}
@keyframes innerPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){
  .network-card *{animation:none!important;}
}

.domain-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:64px;
}
@media(max-width:900px){.domain-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.domain-grid{grid-template-columns:1fr;}.hero-grid{grid-template-columns:1fr;}}
.domain-card{padding:24px;transition:transform .2s, box-shadow .2s;cursor:pointer;}
.domain-card:hover{transform:translateY(-4px);}
.domain-icon{
  width:46px;height:46px;border-radius:13px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:center;color:var(--accent);
  background:var(--bg);box-shadow:inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l);
}
.domain-card h3{font-size:16px;margin-bottom:7px;}
.domain-card p{font-size:13.5px;color:var(--text-soft);}

section{padding:78px 0;}
.section-alt{background:rgba(210,221,234,0.4);}

/* ============ ABOUT ============ */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;}
@media(max-width:860px){.about-grid{grid-template-columns:1fr;}}
.about-text p{color:var(--text-soft);margin-bottom:16px;font-size:15.5px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px;}
.stat-card{padding:22px;text-align:left;}
.stat-num{font-family:var(--font-mono);font-size:30px;font-weight:600;color:var(--accent);}
.stat-label{font-size:12.5px;color:var(--text-soft);margin-top:4px;}
.about-panel{padding:32px;}
.about-panel h4{font-size:14px;margin-bottom:18px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);font-weight:500;}
.timeline-mini{display:flex;flex-direction:column;gap:0;}
.timeline-mini li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--shadow-d);}
.timeline-mini li:last-child{border-bottom:none;}
.tm-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0;}
.tm-year{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}
.tm-title{font-size:14px;font-weight:600;}

/* ============ EXPERTISE ============ */
.expertise-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px;}
.tab-btn{padding:10px 18px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--text-soft);}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:4px 4px 9px var(--shadow-d);}
.tab-btn:not(.active){background:var(--surface);box-shadow:4px 4px 9px var(--shadow-d), -4px -4px 9px var(--shadow-l);}
.expertise-panel{display:none;}
.expertise-panel.active{display:grid;grid-template-columns:1fr 1fr;gap:40px;animation:fadeUp .3s ease;}
@media(max-width:860px){.expertise-panel.active{grid-template-columns:1fr;}}
.exp-desc h3{font-size:24px;margin-bottom:12px;}
.exp-desc p{color:var(--text-soft);font-size:15px;margin-bottom:22px;}
.chip-row{display:flex;flex-wrap:wrap;gap:9px;}
.chip{
  font-family:var(--font-mono);font-size:12px;padding:7px 13px;
  color:var(--accent-strong);
}
.exp-tools{padding:26px;}
.exp-tools h4{font-size:12.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-soft);margin-bottom:14px;font-family:var(--font-mono);font-weight:500;}

/* ============ PROGRAMMING ============ */
.prog-group{margin-bottom:44px;}
.prog-group h3{font-size:13px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.1em;color:var(--text-soft);margin-bottom:18px;}
.prog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media(max-width:900px){.prog-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.prog-grid{grid-template-columns:1fr;}}
.prog-card{padding:22px;}
.prog-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.prog-icon{
  width:38px;height:38px;border-radius:10px;background:var(--bg);
  box-shadow:inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:600;font-size:12px;color:var(--accent);
}
.prog-card h4{font-size:15.5px;}
.prog-card p{font-size:12.5px;color:var(--text-soft);margin-bottom:10px;}
.prog-related{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);}

/* ============ PROJECTS ============ */
.project-controls{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;margin-bottom:30px;}
.search-box{
  display:flex;align-items:center;gap:10px;padding:12px 18px;flex:1;min-width:220px;max-width:360px;
}
.search-box input{
  border:none;background:none;outline:none;font-size:14px;color:var(--text);width:100%;font-family:var(--font-body);
}
.search-box svg{width:16px;height:16px;color:var(--text-faint);flex-shrink:0;}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:38px;}
.filter-chip{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-soft);}
.filter-chip.active{background:var(--accent);color:#fff;box-shadow:4px 4px 9px var(--shadow-d);}
.filter-chip:not(.active){background:var(--surface);box-shadow:4px 4px 9px var(--shadow-d), -4px -4px 9px var(--shadow-l);}
.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:980px){.project-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.project-grid{grid-template-columns:1fr;}}
.project-card{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s;}
.project-card:hover{transform:translateY(-4px);}
.project-thumb{
  height:130px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);box-shadow:inset 4px 4px 9px var(--shadow-d), inset -4px -4px 9px var(--shadow-l);
  color:var(--accent);overflow:hidden;
}
.project-thumb svg{width:100%;height:100%;}
.project-body{padding:22px;flex:1;display:flex;flex-direction:column;}
.project-cat{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin-bottom:8px;}
.project-card h3{font-size:16.5px;margin-bottom:8px;}
.project-card p{font-size:13.3px;color:var(--text-soft);margin-bottom:14px;flex:1;}
.tech-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.tech-tag{font-family:var(--font-mono);font-size:10.5px;background:var(--bg);padding:5px 9px;border-radius:6px;color:var(--text-soft);}
.project-actions{display:flex;gap:8px;}
.link-btn{font-size:12.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:5px;}
.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-faint);}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,27,38,0.5);backdrop-filter:blur(3px);
  z-index:1000;display:none;align-items:flex-start;justify-content:center;
  padding:60px 20px;overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal-box{
  max-width:720px;width:100%;padding:38px;position:relative;background:var(--surface);
  border-radius:var(--radius-lg);box-shadow:20px 20px 40px rgba(20,27,38,0.3);
  max-height:90vh;overflow-y:auto;
}
.modal-close{
  position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--text-soft);
}
.modal-close:hover{color:var(--accent);}
.modal-box h3{font-size:24px;margin-bottom:6px;padding-right:30px;}
.modal-cat{font-family:var(--font-mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:22px;}
.case-block{margin-bottom:18px;}
.case-block h5{font-size:11.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);font-family:var(--font-mono);margin-bottom:6px;}
.case-block p{font-size:14px;color:var(--text-soft);line-height:1.6;}
.modal-tech{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0;}
.modal-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.status-note{
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;
  background:var(--bg);box-shadow:inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l);
  font-size:12.5px;color:var(--text-soft);flex:1;min-width:220px;
}
.status-note svg{flex-shrink:0;color:var(--gold);}
.modal-visual{
  width:100%;height:190px;margin:20px 0;border-radius:12px;
  background:var(--bg);box-shadow:inset 4px 4px 9px var(--shadow-d), inset -4px -4px 9px var(--shadow-l);
  display:flex;align-items:center;justify-content:center;color:var(--accent);overflow:auto;
}
.modal-visual svg{width:100%;height:100%;padding:16px;}
.visual-caption{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);text-align:center;margin-top:-12px;margin-bottom:18px;}

/* ============ EXPERIENCE ============ */
.timeline{position:relative;padding-left:36px;}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--shadow-d);}
.tl-entry{position:relative;padding-bottom:44px;}
.tl-entry:last-child{padding-bottom:0;}
.tl-marker{
  position:absolute;left:-36px;top:4px;width:18px;height:18px;border-radius:50%;
  background:var(--accent);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--shadow-d);
}

const PAGES = {
  home:pageHome, about:pageAbout, expertise:pageExpertise, programming:pageProgramming,
  projects:pageProjects, experience:pageExperience, education:pageEducation, resume:pageResume,
  github:pageGithub, contact:pageContact
};

let currentPage = 'home';
function render(pageId, sub){
  if(!PAGES[pageId]) pageId='home';
  currentPage = pageId;
  document.getElementById('main').innerHTML = '<div class="page active">'+PAGES[pageId]()+'</div>';
  window.scrollTo({top:0, behavior:'instant'});
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav===pageId && el.classList.contains('nav-link'));
  });
  attachPageHandlers(pageId, sub);
  closeMobile();
}

function go(pageId, sub){
  location.hash = pageId;
  render(pageId, sub);
}

document.addEventListener('click', e=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl){
    e.preventDefault();
    go(navEl.dataset.nav, navEl.dataset.sub);
    return;
  }
});

window.addEventListener('hashchange', ()=>{
  const id = location.hash.replace('#','') || 'home';
  render(id);
});

function attachPageHandlers(pageId, sub){
  if(pageId==='expertise'){
    const tabs = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.expertise-panel');
    function activate(key){
      tabs.forEach(t=>t.classList.toggle('active', t.dataset.tab===key));
      panels.forEach(p=>p.classList.toggle('active', p.dataset.panel===key));
    }
    tabs.forEach(t=>t.addEventListener('click', ()=>activate(t.dataset.tab)));
    if(sub && EXPERTISE[sub]) activate(sub);
  }

  if(pageId==='programming' && sub){
    const target = document.getElementById('prog-'+sub);
    if(target) setTimeout(()=>target.scrollIntoView({behavior:'smooth', block:'start'}), 60);
  }

  if(pageId==='projects'){
    setupProjectFilters();
  }

  if(pageId==='education'){
    document.querySelectorAll('.accordion-item').forEach(item=>{
      item.querySelector('.accordion-head').addEventListener('click', ()=>{
        const wasOpen = item.classList.contains('open');
        document.querySelectorAll('.accordion-item').forEach(i=>i.classList.remove('open'));
        if(!wasOpen) item.classList.add('open');
      });
    });
  }

  if(pageId==='contact'){
    const form = document.getElementById('contactForm');
    form.addEventListener('submit', e=>{
      e.preventDefault();
      document.getElementById('formMsg').classList.add('show');
      setTimeout(()=>{
        form.reset();
        document.getElementById('formMsg').classList.remove('show');
      }, 3000);
    });
  }

  document.querySelectorAll('[data-open-case]').forEach(btn=>{
    btn.addEventListener('click', ()=>openCase(parseInt(btn.dataset.openCase)));
  });
}

function setupProjectFilters(){
  const grid = document.getElementById('projectGrid');
  const search = document.getElementById('projectSearch');
  const chips = document.querySelectorAll('.filter-chip');
  let activeFilter = 'All';

  function apply(){
    const q = search.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll('.project-card').forEach(card=>{
      const cats = card.dataset.cats.split(',');
      const matchesFilter = activeFilter==='All' || cats.includes(activeFilter);
      const matchesSearch = !q || card.dataset.search.includes(q);
      const show = matchesFilter && matchesSearch;
      card.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    let noRes = grid.querySelector('.no-results');
    if(visible===0){
      if(!noRes){
        noRes = document.createElement('div');
        noRes.className='no-results';
        noRes.textContent='No projects match that search or filter.';
        grid.appendChild(noRes);
      }
    } else if(noRes){
      noRes.remove();
    }
  }
  chips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      chips.forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      apply();
    });
  });
  search.addEventListener('input', apply);
}

function openCase(idx){
  const p = PROJECTS[idx];
  const c = p.case;
  const visual = projectVisualSVG(p);
  const caption = visualCaption(p);

  const githubBtn = (p.github && p.github!=='#')
    ? '<a href="'+p.github+'" class="btn btn-ghost btn-sm" target="_blank" rel="noopener">'+icon('github',15)+' GitHub</a>'
    : '';
  const statusNote = '<div class="status-note">'+icon('info',16)+'<span>'+p.status+'</span></div>';

  document.getElementById('modalBox').innerHTML =
    '<button class="icon-btn modal-close" id="modalCloseBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+
    '<h3>'+p.title+'</h3>'+
    '<div class="modal-cat">'+p.platform+' · '+p.cats.join(' / ')+'</div>'+
    '<div class="modal-visual">'+visual+'</div>'+
    '<div class="visual-caption">'+caption+'</div>'+
    '<div class="case-block"><h5>Problem</h5><p>'+c.problem+'</p></div>'+
    '<div class="case-block"><h5>Objective</h5><p>'+c.objective+'</p></div>'+
    '<div class="case-block"><h5>Architecture</h5><p>'+c.architecture+'</p></div>'+
    '<div class="case-block"><h5>Technologies</h5><p>'+c.technologies+'</p></div>'+
    '<div class="case-block"><h5>Hardware</h5><p>'+c.hardware+'</p></div>'+
    '<div class="case-block"><h5>Software</h5><p>'+c.software+'</p></div>'+
    '<div class="case-block"><h5>Implementation</h5><p>'+c.implementation+'</p></div>'+
    '<div class="case-block"><h5>Results</h5><p>'+c.results+'</p></div>'+
    '<div class="case-block"><h5>Challenges</h5><p>'+c.challenges+'</p></div>'+
    '<div class="case-block"><h5>Future Work</h5><p>'+c.future+'</p></div>'+
    '<div class="modal-tech">'+p.tech.map(t=>'<span class="tech-tag">'+t+'</span>').join('')+'</div>'+
    '<div class="modal-actions">'+githubBtn+statusNote+'</div>';

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalCloseBtn').addEventListener('click', closeCase);
}
function closeCase(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeCase();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeCase(); });

function closeMobile(){ document.getElementById('mobileDrawer').classList.remove('open'); }
document.getElementById('menuToggle').addEventListener('click', ()=>document.getElementById('mobileDrawer').classList.add('open'));
document.getElementById('menuClose').addEventListener('click', closeMobile);

buildNav();
render(location.hash.replace('#','') || 'home');
</script>
